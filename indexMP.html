<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fracciones con Pizzi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: cuaderno cuadriculado; mapa de 8 estaciones -> estación con "Aprende" (manipulable) y "Practica" (preguntas generadas) + Gran Examen.
   Un solo tema claro elegido a propósito (papel de cuaderno); todos los colores explícitos. */
:root{
  --paper:#F6F9FF; --grid:#DCE6F5; --ink:#1D2A4D; --ink-soft:#56648A;
  --tomato:#E5483B; --cheese:#FFC83D; --basil:#2FA36B; --sky:#3B7DDD; --card:#FFFFFF; --line:#C9D6EC;
  --ok-bg:#E3F6EC; --bad-bg:#FDECEA; --hint-bg:#FFF6DA;
  --display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Lexend","Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:12px 48px}
button{font-family:inherit;cursor:pointer;color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.3px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;justify-content:space-between;
  background:var(--paper);border-bottom:2px dashed var(--line);padding:10px 16px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:22px;color:var(--tomato);background:none;border:0;padding:0}
.chips{display:flex;gap:8px;align-items:center}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:600;font-variant-numeric:tabular-nums}
.chip button{background:none;border:0;font-size:15px;padding:0}
.star{width:20px;height:20px;flex:none}
/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin:22px 0 8px}
.bubble{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:14px 18px;box-shadow:5px 5px 0 var(--cheese)}
.bubble:before{content:"";position:absolute;left:-16px;top:34px;border:8px solid transparent;border-right:12px solid var(--ink)}
.bubble h1{font-size:clamp(26px,5vw,40px);color:var(--ink);line-height:1.1}
.bubble p{margin:6px 0 0;color:var(--ink-soft)}
.pizzi{width:118px;height:auto;flex:none}
.pizzi.bounce{animation:bounce .6s ease}
.pizzi.shake{animation:shake .5s ease}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-18px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.eye{animation:blink 4s infinite;transform-origin:center;transform-box:fill-box}
/* mapa */
.sectitle{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 12px;flex-wrap:wrap}
.sectitle h2{font-size:26px}
.sectitle span{color:var(--ink-soft);font-size:15px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.station{position:relative;text-align:left;background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:14px 14px 12px;
  display:flex;flex-direction:column;gap:8px;transition:transform .15s ease,box-shadow .15s ease;box-shadow:0 4px 0 var(--ink)}
.station:hover{transform:translateY(-3px) rotate(-.5deg);box-shadow:0 7px 0 var(--ink)}
.station:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.station .num{font-family:var(--display);font-size:15px;color:var(--card);background:var(--c,var(--sky));border-radius:999px;width:30px;height:30px;display:grid;place-items:center}
.station .row{display:flex;align-items:center;justify-content:space-between}
.station h3{font-size:19px;line-height:1.15}
.station p{margin:0;color:var(--ink-soft);font-size:14px;line-height:1.35}
.stars{display:flex;gap:2px}
.exam-card{margin-top:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--ink);color:var(--card);border-radius:20px;padding:18px 20px}
.exam-card h3{font-size:24px;color:var(--cheese)}
.exam-card p{margin:2px 0 0;color:#D5DDF0;font-size:15px}
.exam-card > div{flex:1;min-width:0}
.btn{font-weight:700;font-size:17px;border:3px solid var(--ink);border-radius:14px;padding:10px 18px;background:var(--cheese);box-shadow:0 4px 0 var(--ink);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--card)}
.btn.go{background:var(--basil);color:#fff}
.btn.red{background:var(--tomato);color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
/* estación */
.back{background:none;border:0;font-weight:600;color:var(--ink-soft);padding:6px 0;font-size:16px}
.st-head{display:flex;align-items:center;gap:14px;margin:6px 0 14px;flex-wrap:wrap}
.st-head h2{font-size:clamp(26px,5vw,36px);color:var(--ink)}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{border:3px solid var(--ink);background:var(--card);border-radius:12px 12px 0 0;padding:8px 18px;font-weight:700;font-size:16px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--card)}
.panel{background:var(--card);border:3px solid var(--ink);border-radius:0 18px 18px 18px;padding:18px;min-width:0}
.rule{background:var(--hint-bg);border:2px dashed var(--cheese);border-radius:14px;padding:12px 14px;margin-bottom:16px}
.rule b{color:var(--tomato)}
.lab{display:grid;gap:14px}
.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.ctrl{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;color:var(--ink-soft)}
.ctrl input[type=range]{width:170px;accent-color:var(--tomato)}
select{font-family:inherit;font-size:16px;border:2px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--card);color:var(--ink)}
.big{font-family:var(--display);font-size:30px;color:var(--ink)}
.badge{display:inline-block;border-radius:999px;padding:3px 12px;font-weight:700;font-size:14px;background:var(--sky);color:#fff}
.viz{overflow-x:auto;max-width:100%}
.viz svg{display:block;max-width:100%;height:auto}
.note{color:var(--ink-soft);font-size:15px;margin:0}
.steps{display:grid;gap:8px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start}
.steps li:before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--sky);color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px}
.keyword-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.kw{border:3px solid var(--ink);border-radius:14px;background:var(--paper);padding:12px;text-align:left;min-height:96px;font-size:15px;perspective:600px}
.kw b{display:block;font-size:17px}
.kw .ans{display:none;color:var(--basil);font-weight:700;margin-top:6px}
.kw.open .ans{display:block;animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.flip{display:inline-flex;gap:10px;align-items:center;font-family:var(--display);font-size:30px}
.fcard{display:inline-grid;place-items:center;min-width:64px;padding:6px 10px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);transition:transform .6s ease}
.fcard.flipped{transform:rotateX(360deg);background:var(--hint-bg)}
/* práctica */
.progress{display:flex;gap:6px;margin-bottom:14px}
.progress i{flex:1;height:10px;border-radius:6px;background:var(--grid)}
.progress i.ok{background:var(--basil)}.progress i.bad{background:var(--tomato)}.progress i.now{background:var(--cheese)}
.qtext{font-size:20px;font-weight:500;margin:0 0 12px}
.qtext b{font-weight:700;color:var(--tomato)}
.qviz{margin:6px 0 14px;display:flex;justify-content:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt{border:3px solid var(--ink);border-radius:14px;background:var(--paper);padding:12px;font-size:20px;font-weight:600;box-shadow:0 3px 0 var(--ink)}
.opt:hover{background:var(--hint-bg)}
.opt.sel-ok{background:var(--ok-bg);border-color:var(--basil)}
.opt.sel-bad{background:var(--bad-bg);border-color:var(--tomato)}
.answer-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.frac{display:inline-grid;justify-items:center;gap:4px}
.frac input,.numin{width:74px;font-family:var(--display);font-size:26px;text-align:center;border:3px solid var(--ink);border-radius:12px;padding:4px;background:var(--paper);color:var(--ink)}
.frac hr{width:84px;border:0;border-top:4px solid var(--ink);margin:0}
.whole{width:64px}
.fb{margin-top:14px;border-radius:14px;padding:12px 14px;display:none}
.fb.show{display:block;animation:pop .25s ease}
.fb.ok{background:var(--ok-bg);border:2px solid var(--basil)}
.fb.bad{background:var(--bad-bg);border:2px solid var(--tomato)}
.fb.hint{background:var(--hint-bg);border:2px solid var(--cheese)}
.fb h4{margin:0 0 4px;font-size:18px}
.fb p{margin:0}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.result{text-align:center;display:grid;gap:12px;justify-items:center;padding:10px}
.result .bigstars{display:flex;gap:8px}
.result .bigstars svg{width:60px;height:60px}
.result h3{font-size:32px}
.review{text-align:left;width:100%;display:grid;gap:10px}
.review div{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper)}

.vf{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-weight:700;margin:0 2px;font-variant-numeric:tabular-nums}
.vf span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.vf span:last-child{padding:0 3px}
.vmix{display:inline-flex;align-items:center;font-weight:700}
.xsteps{list-style:none;counter-reset:x;margin:8px 0 0;padding:0;display:grid;gap:8px}
.xsteps li{counter-increment:x;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;line-height:1.7}
.xsteps li:before{content:counter(x);width:26px;height:26px;border-radius:50%;background:var(--sky);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;margin-top:2px}
.xsteps li.pop{animation:pop .3s ease}
.xsteps mark{background:var(--cheese);color:var(--ink);border-radius:4px;padding:0 4px;font-weight:700}
.xans{display:inline-flex;align-items:center;gap:4px;background:var(--ok-bg);border:2px solid var(--basil);border-radius:10px;padding:1px 8px;font-weight:700}
.xviz{margin-top:10px;display:grid;justify-items:center;gap:4px;overflow-x:auto;max-width:100%}
.xviz svg{max-width:100%;height:auto}
.fb details summary{cursor:pointer;font-weight:600;color:var(--sky);margin-top:4px}
.worked{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:14px;margin-bottom:16px;min-width:0}
.wk-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.wk-head h3{font-size:20px}
.wk-kinds{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.wk-prob{font-size:20px;font-weight:600;margin:12px 0 4px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.labtitle{font-size:20px;margin:6px 0 10px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
.foot{margin-top:28px;color:var(--ink-soft);font-size:14px;text-align:center}
@media (max-width:560px){
  .hero{grid-template-columns:1fr;justify-items:center}
  .bubble:before{display:none}
  .pizzi{width:96px}
  .brand span{display:none}
  .panel{padding:14px}
  .qtext{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <button class="brand" id="home-btn" aria-label="Ir al mapa">
    <svg width="34" height="34" viewBox="0 0 100 100" aria-hidden="true"><use href="#pizzi-sym"/></svg><span>Fracciones con Pizzi</span>
  </button>
  <div class="chips">
    <div class="chip" title="Estrellas ganadas"><svg class="star" viewBox="0 0 24 24"><use href="#star-on"/></svg><span id="star-count">0</span> / 24</div>
    <div class="chip"><button id="sound-btn" aria-pressed="true" aria-label="Sonido">🔊</button></div>
  </div>
</header>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="star-on" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z" fill="#FFC83D" stroke="#1D2A4D" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="star-off" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z" fill="#E6ECF7" stroke="#B4C2DD" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="pizzi-sym" viewBox="0 0 100 100">
      <path d="M50 96 L10 16 Q50 2 90 16 Z" fill="#FFC83D" stroke="#1D2A4D" stroke-width="5" stroke-linejoin="round"/>
      <path d="M10 16 Q50 2 90 16 L86 26 Q50 12 14 26 Z" fill="#E59A4B" stroke="#1D2A4D" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="34" cy="44" r="6" fill="#E5483B"/><circle cx="66" cy="42" r="6" fill="#E5483B"/><circle cx="52" cy="74" r="5" fill="#E5483B"/>
    </symbol>
  </defs>
</svg>

<main class="wrap" id="app"></main>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
/* ====== utilidades ====== */
const $ = (s, el = document) => el.querySelector(s);
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
const lcm = (a, b) => a * b / gcd(a, b);
const simp = (n, d) => { const g = gcd(n, d) || 1; return [n / g, d / g]; };
const fs = (n, d) => `${n}/${d}`;
const FS = (n, d) => { const [a, b] = simp(n, d); return b === 1 ? `${a}` : `${a}/${b}`; };
const mixedS = (n, d) => { const [a, b] = simp(n, d); if (b === 1) return `${a}`; if (a < b) return `${a}/${b}`; return a % b ? `${Math.floor(a / b)} ${a % b}/${b}` : `${a / b}`; };
const full = (n, d) => { const out = [fs(n, d)]; const s = FS(n, d); if (!out.includes(s)) out.push(s); const m = mixedS(n, d); if (!out.includes(m)) out.push(m); return out.join(' = '); };
const multiples = (n, upTo) => { const r = []; for (let i = n; i <= upTo; i += n) r.push(i); return r.join(', '); };
function mcOpts(correct, distract) {
  const set = [String(correct)];
  for (const d of distract) { const s = String(d); if (!set.includes(s) && set.length < 4) set.push(s); }
  let k = 1; while (set.length < 4) { const s = String(Number(correct) + k * 3 || correct + "'".repeat(k)); if (!set.includes(s)) set.push(s); k++; }
  const opts = shuffle(set); return { options: opts, answer: opts.indexOf(String(correct)) };
}
const store = {
  get(k, d) { try { const v = localStorage.getItem('pizzi_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pizzi_' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ====== sonido ====== */
let soundOn = store.get('sound', true), actx = null;
function tone(freqs, dur = .12, type = 'triangle') {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * dur;
      o.type = type; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .02);
    });
  } catch (e) {}
}
const sfx = { ok: () => tone([660, 880, 1175]), bad: () => tone([300, 220], .16, 'sine'), win: () => tone([523, 659, 784, 1046, 1318], .11), tap: () => tone([520], .05) };
function setSoundBtn() { const b = $('#sound-btn'); b.textContent = soundOn ? '🔊' : '🔈'; b.setAttribute('aria-pressed', soundOn); }
$('#sound-btn').onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); setSoundBtn(); sfx.tap(); };
setSoundBtn();

/* ====== confeti ====== */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(n = 140) {
  if (reduce) return;
  const c = $('#confetti'), ctx = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const cols = ['#E5483B', '#FFC83D', '#2FA36B', '#3B7DDD', '#1D2A4D'];
  const ps = Array.from({ length: n }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .4, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 3, r: 4 + Math.random() * 5, a: Math.random() * 6, va: (Math.random() - .5) * .3, col: pick(cols) }));
  let t = 0; (function f() {
    ctx.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .03; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.col; ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * .6); ctx.restore(); });
    if (++t < 200) requestAnimationFrame(f); else ctx.clearRect(0, 0, c.width, c.height);
  })();
}

/* ====== dibujos SVG ====== */
const C = { ink: '#1D2A4D', soft: '#56648A', tomato: '#E5483B', cheese: '#FFC83D', basil: '#2FA36B', sky: '#3B7DDD', paper: '#F6F9FF', line: '#C9D6EC', card: '#FFFFFF' };
function pizziSVG(cls = 'pizzi', mood = 'happy') {
  const mouth = mood === 'happy' ? '<path d="M40 54 Q50 64 60 54" fill="none" stroke="#1D2A4D" stroke-width="4" stroke-linecap="round"/>' : '<path d="M42 60 Q50 54 58 60" fill="none" stroke="#1D2A4D" stroke-width="4" stroke-linecap="round"/>';
  return `<svg class="${cls}" viewBox="0 0 100 110" role="img" aria-label="Pizzi, la porción de pizza">
    <ellipse cx="50" cy="106" rx="22" ry="4" fill="#C9D6EC"/>
    <use href="#pizzi-sym" width="100" height="100"/>
    <g class="eye"><ellipse cx="40" cy="38" rx="5" ry="6.5" fill="#fff" stroke="#1D2A4D" stroke-width="2.5"/><circle cx="41" cy="39" r="2.6" fill="#1D2A4D"/></g>
    <g class="eye"><ellipse cx="60" cy="38" rx="5" ry="6.5" fill="#fff" stroke="#1D2A4D" stroke-width="2.5"/><circle cx="61" cy="39" r="2.6" fill="#1D2A4D"/></g>
    ${mouth}</svg>`;
}
function starRow(n, total = 3, size = 18) { let s = ''; for (let i = 0; i < total; i++) s += `<svg width="${size}" height="${size}" viewBox="0 0 24 24"><use href="#${i < n ? 'star-on' : 'star-off'}"/></svg>`; return `<span class="stars">${s}</span>`; }
// barras: n de d, dibuja varias unidades si n>d
function barSVG(n, d, opt = {}) {
  const W = opt.w || 320, H = 40, units = Math.max(1, Math.ceil(n / d)), gap = 12, color = opt.color || C.tomato;
  const totalH = units * H + (units - 1) * gap + 4;
  let s = `<svg viewBox="-2 -2 ${W + 4} ${totalH + 2}" width="${W}" role="img" aria-label="Barra con ${n} de ${d} partes pintadas">`;
  let k = 0;
  for (let u = 0; u < units; u++) for (let i = 0; i < d; i++, k++) {
    const x = i * W / d, y = u * (H + gap);

/* ====== explicaciones paso a paso ====== */
const vf = (n, d) => `<span class="vf"><span>${n}</span><span>${d}</span></span>`;
function vmix(n, d) { const [a, b] = simp(n, d); if (b === 1) return `${a}`; if (a < b) return vf(a, b); const q = Math.floor(a / b), r = a % b; return `<span class="vmix">${q}&nbsp;${vf(r, b)}</span>`; }

// cierre: simplificar y pasar a mixto si hace falta
function sFinish(n, d, u = '') {
  const out = [];
  if (n % d === 0) { out.push(`${vf(n, d)} es lo mismo que ${n} ÷ ${d} = ${n / d}.`); out.push(`Respuesta: ${ANS(n / d, u)}`); return out; }
  const g = gcd(n, d); let N = n, D = d;
  if (g > 1) { N = n / g; D = d / g; out.push(`Simplifica: ${n} y ${d} se pueden dividir entre ${g}. ${n} ÷ ${g} = ${N} y ${d} ÷ ${g} = ${D}. Queda ${vf(N, D)}.`); }
  if (N > D) { const q = Math.floor(N / D), r = N % D; out.push(`Como arriba (${N}) es mayor que abajo (${D}), pásalo a número mixto: ${N} ÷ ${D} = ${q} ${plural(q, 'entero', 'enteros')} y sobran ${r}.`); out.push(`Respuesta: ${ANS(vmix(N, D), u)} (también vale ${vf(N, D)})`); }
  else out.push(`Respuesta: ${ANS(vf(N, D), u)}`);
  return out;
}

/* --- clases de fracciones --- */

/* --- MCM --- */
function sMCM(a, b, u = '') {
  const m = lcm(a, b), s = [
    `Escribe los múltiplos de ${a} (la tabla del ${a}): ${hl(mults(a, m), m)}…`,
    `Escribe los múltiplos de ${b}: ${hl(mults(b, m), m)}…`,
    `Busca el <b>primer</b> número que aparece en las dos listas: <b>${m}</b>.`];
  if (m === Math.max(a, b)) s.push(`Fíjate: ${Math.max(a, b)} ya está en la tabla del ${Math.min(a, b)}, por eso el MCM es el mismo ${Math.max(a, b)}.`);
  else if (m < a * b) s.push(`Ojo: ${a} × ${b} = ${a * b} también está en las dos tablas, pero no es el más <b>pequeño</b>.`);
  s.push(`MCM(${a}, ${b}) = ${ANS(m, u)}`);
  return s;
}

/* --- suma y resta --- */
function sHomo(a, b, d, op = '+', u = '') {
  const r = op === '+' ? a + b : a - b;
  return [
    `Las dos fracciones tienen el mismo denominador (${d}): son piezas del mismo tamaño, solo hay que contarlas.`,
    `${op === '+' ? 'Suma' : 'Resta'} <b>solo los numeradores</b>: ${a} ${OPW[op]} ${b} = ${r}.`,
    `El denominador se queda igual: ${vf(r, d)}. ¡Los de abajo nunca se suman ni se restan!`,

}
function sConv(a, d, m) {
  const k = m / d;
  return k === 1 ? `${vf(a, d)} ya tiene denominador ${m}: se queda igual.` : `Convierte ${vf(a, d)}: ¿por cuánto multiplico ${d} para llegar a ${m}? Por ${k}. Lo que haces abajo lo haces arriba: ${a} × ${k} = ${a * k}. Queda ${vf(a * k, m)}.`;
}
function sLcmLine(d1, d2) { const m = lcm(d1, d2); return `Busca el MCM de ${d1} y ${d2}. Múltiplos de ${d1}: ${hl(mults(d1, m), m)}… Múltiplos de ${d2}: ${hl(mults(d2, m), m)}… El MCM es <b>${m}</b>: ese será el nuevo denominador.`; }
function sHet(a, d1, b, d2, op = '+', u = '') {
  const m = lcm(d1, d2), A = a * m / d1, B = b * m / d2, R = op === '+' ? A + B : A - B;
  return [
    `Los denominadores son distintos (${d1} y ${d2}): las piezas son de distinto tamaño y no se pueden ${op === '+' ? 'sumar' : 'restar'} así.`,
    sLcmLine(d1, d2), sConv(a, d1, m), sConv(b, d2, m),
    `Ahora son homogéneas: ${vf(A, m)} ${OPW[op]} ${vf(B, m)}. ${op === '+' ? 'Suma' : 'Resta'} los numeradores: ${A} ${OPW[op]} ${B} = ${R}. Queda ${vf(R, m)}.`,

}

/* ====== motor de preguntas ====== */
function renderQuestion(box, q, onDone) {
  let tries = 0;
  const inputHTML = q.type === 'mc' ? `<div class="opts">${q.options.map((o, k) => `<button class="opt" data-k="${k}">${o}</button>`).join('')}</div>`
    : q.type === 'num' ? `<div class="answer-row"><input class="numin" id="ans-num" inputmode="numeric" aria-label="Tu respuesta"><button class="btn go" id="check">Comprobar</button></div>`
    : q.type === 'frac' ? `<div class="answer-row"><span class="frac"><input id="ans-n" inputmode="numeric" aria-label="Numerador"><hr><input id="ans-d" inputmode="numeric" aria-label="Denominador"></span><button class="btn go" id="check">Comprobar</button></div>`
    : `<div class="answer-row"><input class="numin whole" id="ans-w" inputmode="numeric" aria-label="Entero"><span class="frac"><input id="ans-n" inputmode="numeric" aria-label="Numerador"><hr><input id="ans-d" inputmode="numeric" aria-label="Denominador"></span><button class="btn go" id="check">Comprobar</button></div>`;
  box.innerHTML = `<p class="qtext">${q.text}</p>${q.viz ? `<div class="qviz viz">${q.viz}</div>` : ''}${inputHTML}<div class="fb" id="fb"></div><div class="actions" id="next-row" hidden><button class="btn" id="next">Siguiente →</button></div>`;
  const fb = $('#fb', box), pz = document.getElementById('pz');
  const val = id => { const e = $('#' + id, box); const v = e ? e.value.replace(/[.,$\s]/g, '') : ''; return v !== '' && /^-?\d+$/.test(v) ? Number(v) : NaN; };
  function judge(given) {
    let ok = false;
    if (q.type === 'mc') ok = given === q.answer;
    else if (q.type === 'num') { const v = val('ans-num'); if (isNaN(v)) return say('hint', 'Escribe un número', 'Pon tu respuesta en la casilla.'); ok = v === q.ans; }
    else if (q.type === 'frac') { const n = val('ans-n'), d = val('ans-d'); if (isNaN(n) || isNaN(d) || d === 0) return say('hint', 'Completa la fracción', 'Escribe el número de arriba y el de abajo.'); ok = q.exact ? (n === q.ans[0] && d === q.ans[1]) : n * q.ans[1] === q.ans[0] * d; }
    else { const w = val('ans-w') || 0, n = val('ans-n'), d = val('ans-d'); if (isNaN(n) || isNaN(d) || d === 0) return say('hint', 'Completa el número mixto', 'Escribe el entero y la fracción.'); ok = n < d && (w * d + n) * q.ans[1] === q.ans[0] * d; }
    tries++;
    if (ok) { sfx.ok(); pz && (pz.classList.remove('bounce'), void pz.offsetWidth, pz.classList.add('bounce')); say('ok', pick(['¡Excelente, María Paz!', '¡Muy bien!', '¡Genial!', '¡Eso es, María Paz!', '¡Lo lograste!', '¡Tus primos estarían orgullosos!', '¡Súper, María Paz!']), `<details><summary>Ver la explicación paso a paso</summary>${q.explain}</details>`); finish(true); }
    else if (tries === 1) { sfx.bad(); pz && (pz.classList.remove('shake'), void pz.offsetWidth, pz.classList.add('shake')); say('hint', 'Casi… inténtalo otra vez', `<b>Pista:</b> ${q.hint}`); }
    else { sfx.bad(); say('bad', 'No pasa nada. Mira cómo se hace, paso a paso:', q.explain); finish(false); }
    return ok;
  }
  function say(kind, title, body) { fb.className = 'fb show ' + kind; fb.innerHTML = `<h4>${title}</h4><div>${body}</div>`; }
  function finish(ok) {
    box.querySelectorAll('input,.opt,#check').forEach(e => e.disabled = true);
    if (q.type === 'mc') box.querySelectorAll('.opt')[q.answer].classList.add('sel-ok');
    $('#next-row', box).hidden = false; $('#next', box).focus();
    $('#next', box).onclick = () => onDone(ok && tries === 1, ok);
  }
  if (q.type === 'mc') box.querySelectorAll('.opt').forEach(b => b.onclick = () => { const k = +b.dataset.k; if (!judge(k)) b.classList.add('sel-bad'); });
  else { $('#check', box).onclick = () => judge(); box.querySelectorAll('input').forEach(inp => inp.addEventListener('keydown', e => { if (e.key === 'Enter') judge(); })); box.querySelector('input').focus({ preventScroll: true }); }
}

/* ====== sorteo sin repetir dentro de una ronda ====== */
function makeDraw() {
  const bags = {}, seen = new Set();
  return t => {
    for (let tries = 0; tries < 12; tries++) {
      if (!bags[t] || !bags[t].length) bags[t] = shuffle(GEN[t].flatMap((_, i) => FAMQ[t].has(i) ? [i, i] : [i]));
      const q = GEN[t][bags[t].pop()]();
      const key = q.text + (q.viz || '');
      if (!seen.has(key)) { seen.add(key); return q; }
    }
    return pick(GEN[t])();
  };
}
const FAM_RE = /María Paz|Martín|Jero|Salomé|Natalia|Bibiana|Jorge|Julián|Juan Pablo|Laura|John Fredy/;
// ejercicios con historias de la familia: salen el doble de veces
const FAMQ = GEN.map(g => new Set(g.map((f, i) => [0, 1, 2, 3, 4, 5].some(() => FAM_RE.test(f().text)) ? i : -1).filter(i => i >= 0)));
const BANK_TOTAL = GEN.reduce((a, g) => a + g.length, 0);
function chooser(title, sub, counts, def, onGo) {
  return `<div class="result"><h3>${title}</h3><p class="note">${sub}</p>
    <div class="actions" role="group" aria-label="Cantidad de ejercicios">${counts.map(n => `<button class="btn ${n === def ? '' : 'alt'}" data-n="${n}">${n} ejercicios</button>`).join('')}</div></div>`;
}
function stars3(good, N) { const p = good / N; return p >= .9 ? 3 : p >= .7 ? 2 : p >= .4 ? 1 : 0; }
function reviewList(items) {
  if (!items.length) return '';
  return `<div class="review"><b>Revisa los que fallaste:</b>${items.map(({ q, k }) => `<div><b>${k + 1}.</b> ${q.text}<br><span class="note">${q.explain}</span></div>`).join('')}</div>`;
}

function practice(panel, i) {
  panel.innerHTML = chooser('¿Cuántos ejercicios quieres hacer?', `Esta estación tiene <b>${GEN[i].length} tipos de ejercicio</b> con números al azar. Cada vez que practiques te saldrán ejercicios diferentes.`, [5, 10, 15, 20], 10);
  panel.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { sfx.tap(); run(+b.dataset.n); });
  function run(N) {
    const draw = makeDraw(), qs = Array.from({ length: N }, () => draw(i)), res = [];
    panel.innerHTML = `<div class="progress" id="prog">${'<i></i>'.repeat(N)}</div><p class="note" id="cnt"></p><div id="qbox"></div>`;
    const prog = () => { [...$('#prog').children].forEach((el, k) => el.className = k < res.length ? (res[k] ? 'ok' : 'bad') : k === res.length ? 'now' : ''); $('#cnt').textContent = res.length < N ? `Ejercicio ${res.length + 1} de ${N}` : ''; };
    const next = () => { prog(); if (res.length === N) return done(); renderQuestion($('#qbox'), qs[res.length], first => { res.push(first); next(); }); };
    function done() {
      const good = res.filter(Boolean).length, st = stars3(good, N);
      const improved = st > stars[i]; if (improved) { stars[i] = st; store.set('stars', stars); updateStarCount(); }
      if (st >= 2) { sfx.win(); confetti(); }
      const msg = st === 3 ? '¡Perfecto, María Paz! Dominas este tema.' : st === 2 ? '¡Muy bien! Un poquito más y lo dominas.' : st === 1 ? 'Vas por buen camino. Repasa "Aprende" y vuelve a intentar.' : 'No te preocupes, practicar es como se aprende. Mira "Aprende" y vuelve a intentar.';
      const wrong = qs.map((q, k) => ({ q, k })).filter(x => !res[x.k]);
      $('#cnt').textContent = '';
      $('#qbox').innerHTML = `<div class="result">${pizziSVG('pizzi bounce', 'happy')}<h3>${good} de ${N} a la primera</h3><div class="bigstars">${starRow(st, 3, 60)}</div><p>${msg}${improved ? ' ¡Nuevo récord de estrellas!' : ''}</p>
        <div class="actions"><button class="btn go" id="again">Practicar con otros ejercicios</button>${i < 7 ? `<button class="btn alt" id="nexts">Siguiente estación →</button>` : ''}<button class="btn alt" id="tomap">Volver al mapa</button></div>${reviewList(wrong)}</div>`;
      $('#again').onclick = () => station(i, 'prac'); $('#tomap').onclick = home; if (i < 7) $('#nexts').onclick = () => station(i + 1, 'learn');

  }
}

function exam() {
  app.innerHTML = `<button class="back" id="back">← Salir del examen</button>
    <div class="st-head">${pizziSVG('pizzi').replace('class="pizzi"', 'class="pizzi" id="pz" style="width:70px"')}<div><span class="badge" style="background:${C.tomato}">Gran Examen</span><h2>Todos los temas</h2></div></div>

  ep.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { sfx.tap(); run(+b.dataset.n); });
  function run(N) {
    // reparto equilibrado: cada tema aparece N/8 veces; el resto se reparte al azar sin repetir tema
    const order = []; for (let k = 0; k < Math.floor(N / 8); k++) order.push(0, 1, 2, 3, 4, 5, 6, 7);
    order.push(...shuffle([0, 1, 2, 3, 4, 5, 6, 7]).slice(0, N % 8));
    const draw = makeDraw(), qs = shuffle(order).map(t => ({ t, q: draw(t) })), res = [];
    ep.innerHTML = `<div class="progress" id="prog">${'<i></i>'.repeat(N)}</div><p class="note" id="cnt"></p><div id="qbox"></div>`;
    const prog = () => { [...$('#prog').children].forEach((el, k) => el.className = k < res.length ? (res[k] ? 'ok' : 'bad') : k === res.length ? 'now' : ''); $('#cnt').textContent = res.length < N ? `Pregunta ${res.length + 1} de ${N} · Tema: ${ST[qs[res.length].t].name}` : ''; };
    const next = () => { prog(); if (res.length === N) return done(); renderQuestion($('#qbox'), qs[res.length].q, first => { res.push(first); next(); }); };
    function done() {
      const good = res.filter(Boolean).length, grade = (good / N * 5).toFixed(1);
      if (good / N >= .7) { sfx.win(); confetti(220); }
      const byTopic = ST.map((s, t) => { const idx = qs.map((x, k) => k).filter(k => qs[k].t === t); return { t, n: idx.length, ok: idx.filter(k => res[k]).length }; });
      const wrong = qs.map((x, k) => ({ q: x.q, k })).filter(x => !res[x.k]);
      const best = store.get('examBest', 0); const newBest = Number(grade) > best; if (newBest) store.set('examBest', Number(grade));
      $('#cnt').textContent = '';
      $('#qbox').innerHTML = `<div class="result">${pizziSVG('pizzi bounce')}<h3>${good} de ${N} a la primera</h3>
        <p class="big">Nota: ${grade} / 5.0</p>
        <p>${good / N >= .85 ? '¡María Paz, estás lista para la evaluación! Cuéntales a mamá Laura y a papá John Fredy.' : good / N >= .6 ? '¡Vas muy bien! Repasa los temas en amarillo o rojo.' : 'Repasa los temas en rojo en sus estaciones y vuelve a intentarlo.'}${newBest ? ' ¡Es tu mejor nota!' : ''}</p>
        <div class="review"><b>Resultado por tema:</b>${byTopic.map(({ t, n, ok }) => { const p = n ? ok / n : 1, col = p >= .8 ? C.basil : p >= .5 ? C.cheese : C.tomato; return `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span class="badge" style="background:${col};color:${col === C.cheese ? C.ink : '#fff'}">${ok}/${n}</span><span style="flex:1;min-width:0">${t + 1}. ${ST[t].name}</span>${p < .8 ? `<button class="btn alt" style="padding:4px 12px;font-size:14px" data-t="${t}">Repasar</button>` : ''}</div>`; }).join('')}</div>
        <div class="actions"><button class="btn go" id="again">Otro examen diferente</button><button class="btn alt" id="tomap">Volver al mapa</button></div>${reviewList(wrong)}</div>`;
      $('#again').onclick = exam; $('#tomap').onclick = home;
      $('#qbox').querySelectorAll('[data-t]').forEach(b => b.onclick = () => station(+b.dataset.t, 'learn'));

      <div class="viz" id="v2"></div><p class="big" id="r2" style="font-size:24px"></p><p class="note" id="l2"></p>`;
    let timer = null;
    const draw = (anim) => { clearTimeout(timer); const a = +$('#a2').value, b = +$('#b2').value, m = lcm(a, b), max = Math.max(m * 1.25, 24), s = 640 / max, H = 170, y = 95;
      let svg = `<svg viewBox="-12 0 ${640 + 30} ${H}" width="${Math.max(640, 0)}" style="min-width:560px">`;
      svg += `<line x1="0" y1="${y}" x2="640" y2="${y}" stroke="${C.ink}" stroke-width="3"/>`;
      for (let i = 0; i <= max; i++) { const x = i * s; svg += `<line x1="${x}" y1="${y - 5}" x2="${x}" y2="${y + 5}" stroke="${C.ink}" stroke-width="${i % 5 ? 1.2 : 2.5}"/>`; if (i % (max > 40 ? 5 : 2) === 0) svg += `<text x="${x}" y="${y + 24}" text-anchor="middle" font-size="12" font-family="Lexend" fill="${C.soft}">${i}</text>`; }
      const arcs = []; for (let i = 0; i + a <= max; i += a) arcs.push(`<path class="arc" d="M${i * s} ${y} Q${(i + a / 2) * s} ${y - 70 * Math.min(1, a / 6 + .3)} ${(i + a) * s} ${y}" fill="none" stroke="${C.tomato}" stroke-width="3"/>`);
      const arcsB = []; for (let i = 0; i + b <= max; i += b) arcsB.push(`<path class="arc" d="M${i * s} ${y} Q${(i + b / 2) * s} ${y + 70 * Math.min(1, b / 8 + .3)} ${(i + b) * s} ${y}" fill="none" stroke="${C.basil}" stroke-width="3" stroke-dasharray="6 4"/>`);
      svg += `<g id="arcsA">${arcs.join('')}</g><g id="arcsB">${arcsB.join('')}</g>`;
      for (let k = m; k <= max; k += m) svg += `<circle cx="${k * s}" cy="${y}" r="${k === m ? 12 : 9}" fill="${C.cheese}" stroke="${C.ink}" stroke-width="2.5" class="hit" ${anim ? 'opacity="0"' : ''}/>`;
      svg += `<text x="${m * s}" y="22" text-anchor="middle" font-family="Bagel Fat One, sans-serif" font-size="18" fill="${C.ink}" class="hit" ${anim ? 'opacity="0"' : ''}>MCM = ${m}</text></svg>`;
      $('#v2').innerHTML = svg;
      $('#l2').innerHTML = `Múltiplos de ${a}: ${multiples(a, m)}…<br>Múltiplos de ${b}: ${multiples(b, m)}…`;
      $('#r2').textContent = anim ? '' : `MCM(${a}, ${b}) = ${m}`;
      if (anim && !reduce) {
        const all = [...$('#v2').querySelectorAll('.arc')]; all.forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; });
        let k = 0; const step = () => { if (k < all.length) { const p = all[k++]; p.style.transition = 'stroke-dashoffset .3s'; p.style.strokeDashoffset = 0; if (k % 2) sfx.tap(); timer = setTimeout(step, 180); } else { $('#v2').querySelectorAll('.hit').forEach(h => h.setAttribute('opacity', 1)); $('#r2').textContent = `¡Coinciden en ${m}! MCM(${a}, ${b}) = ${m}`; sfx.ok(); } };
        step();
      } else $('#v2').querySelectorAll('.hit').forEach(h => h.setAttribute('opacity', 1));
    };
    $('#go2').onclick = () => draw(true); $('#a2').onchange = () => draw(false); $('#b2').onchange = () => draw(false); draw(false);
  },
  // 3 homogéneas
  lab => {
    lab.innerHTML = `<p class="note">Con el mismo denominador, las piezas son del mismo tamaño. Solo hay que contarlas.</p>
      <div class="controls">${range('d3', 'Denominador', 2, 12, 8)}${range('a3', 'Primera fracción', 1, 12, 3)}${range('b3', 'Segunda fracción', 1, 12, 2)}
      <label class="ctrl" for="o3">Operación <select id="o3"><option value="+">Sumar (+)</option><option value="-">Restar (−)</option></select></label></div>
      <p class="big" id="f3"></p><div class="viz" id="v3"></div><p class="note" id="e3"></p>`;
    const upd = () => { const d = +$('#d3').value; $('#a3').max = d * 2 - 1; $('#b3').max = d * 2 - 1; let a = +$('#a3').value, b = +$('#b3').value; const op = $('#o3').value;
      if (op === '-' && b > a) { b = a; $('#b3').value = a; }
      if (op === '+') { $('#f3').textContent = `${a}/${d} + ${b}/${d} = ${a + b}/${d}`; $('#v3').innerHTML = barSVG(a + b, d, { second: [a, b] }); $('#e3').innerHTML = `Rojo (${a}) + amarillo (${b}) = <b>${a + b}</b> piezas de ${d}. El denominador sigue siendo ${d}.${a + b > d ? ` Como pasa del entero, es ${mixedS(a + b, d)}.` : ''}`; }
      else { $('#f3').textContent = `${a}/${d} − ${b}/${d} = ${a - b}/${d}`; $('#v3').innerHTML = barSVG(a, d, { cross: [a - b, b] }); $('#e3').innerHTML = `Teníamos ${a} piezas, quitamos ${b} (las tachadas) y quedan <b>${a - b}</b>.`; } };
    lab.querySelectorAll('input,select').forEach(e => e.oninput = upd); upd();
  },
  // 4 heterogéneas
  lab => {
    lab.innerHTML = `<p class="note">No se pueden sumar piezas de distinto tamaño. Primero hay que <b>partirlas en piezas iguales</b>, usando el MCM.</p>
      <div class="controls">${sel('p4', 'Elige la suma', ['1/2 + 1/4', '1/3 + 1/6', '2/3 + 1/4', '1/2 + 3/8', '3/4 + 1/8', '1/2 + 1/3', '2/5 + 3/10'], '1/2 + 1/4')}<button class="btn" id="go4">Partir en piezas iguales</button></div>
      <div class="viz" id="v4"></div><p class="big" id="f4" style="font-size:24px"></p><p class="note" id="e4"></p>`;
    let split = false;
    const upd = () => { const [[a, d1], [b, d2]] = $('#p4').value.split(' + ').map(x => x.split('/').map(Number)), m = lcm(d1, d2), A = a * m / d1, B = b * m / d2;
      const da = split ? m : d1, db = split ? m : d2, na = split ? A : a, nb = split ? B : b;
      $('#v4').innerHTML = `<div style="display:grid;gap:8px">${barSVG(na, da, { w: 320 })}${barSVG(nb, db, { w: 320, color: C.cheese })}</div>`;
      $('#f4').textContent = split ? `${A}/${m} + ${B}/${m} = ${full(A + B, m)}` : `${a}/${d1} + ${b}/${d2} = ?`;
      $('#e4').innerHTML = split ? `MCM(${d1}, ${d2}) = ${m}. Ahora todas las piezas son de 1/${m}: ${a}/${d1} = ${A}/${m} y ${b}/${d2} = ${B}/${m}.` : 'Las piezas rojas y amarillas tienen distinto tamaño. Toca el botón.';
      $('#go4').textContent = split ? 'Volver a las piezas originales' : 'Partir en piezas iguales'; };
    $('#go4').onclick = () => { split = !split; if (split) sfx.ok(); upd(); }; $('#p4').onchange = () => { split = false; upd(); }; upd();
  },
  // 5 multiplicación
  lab => {
    lab.innerHTML = `<p class="note">Multiplicar fracciones es buscar "una parte de otra parte". Las columnas azules muestran la primera fracción y las filas amarillas, la segunda. Donde se cruzan (verde) está el resultado.</p>
      <div class="controls">${sel('a5', 'Primera', ['1/2', '2/3', '3/4', '1/3', '2/5', '3/5'], '2/3')}<span class="big">×</span>${sel('b5', 'Segunda', ['1/2', '3/4', '1/3', '2/5', '1/4', '3/5'], '3/4')}</div>
      <div class="controls"><div class="viz" id="v5"></div><div><p class="big" id="f5"></p><p class="note" id="e5"></p></div></div>`;
    const upd = () => { const [a, b] = $('#a5').value.split('/').map(Number), [c, d] = $('#b5').value.split('/').map(Number), S = 220;
      let s = `<svg viewBox="-4 -4 ${S + 8} ${S + 8}" width="${S}">`;
      for (let i = 0; i < b; i++) for (let j = 0; j < d; j++) { const inA = i < a, inB = j < c; const f = inA && inB ? C.basil : inA ? '#9CC3F0' : inB ? '#FFE08A' : C.card;
        s += `<rect x="${i * S / b}" y="${j * S / d}" width="${S / b}" height="${S / d}" fill="${f}" stroke="${C.ink}" stroke-width="2"/>`; }
      $('#v5').innerHTML = s + '</svg>';
      $('#f5').textContent = `${a}/${b} × ${c}/${d} = ${a * c}/${b * d}`;
      $('#e5').innerHTML = `El cuadro tiene ${b} × ${d} = <b>${b * d}</b> partes (denominador).<br>Las verdes son ${a} × ${c} = <b>${a * c}</b> (numerador).${FS(a * c, b * d) !== fs(a * c, b * d) ? `<br>Simplificada: <b>${FS(a * c, b * d)}</b>` : ''}`; };
    lab.querySelectorAll('select').forEach(e => e.onchange = upd); upd();
  },
  // 6 división
  lab => {
    lab.innerHTML = `<p class="note">Dividir es preguntar: <b>¿cuántas veces cabe</b> la segunda fracción en la primera? El truco: voltear la segunda y multiplicar.</p>
      <div class="controls">${sel('a6', 'Tengo', ['3/4', '1/2', '2/3', '5/6', '1', '3/2'], '3/4')}<span class="big">÷</span>${sel('b6', 'Piezas de', ['1/8', '1/4', '1/6', '1/3', '1/2', '3/8'], '1/8')}<button class="btn" id="go6">Voltear la tarjeta</button></div>
      <div class="flip" id="fl6"></div><div class="viz" id="v6"></div><p class="note" id="e6"></p>`;
    let flipped = false;
    const parse = v => v.includes('/') ? v.split('/').map(Number) : [Number(v), 1];
    const upd = () => { const [a, b] = parse($('#a6').value), [c, d] = parse($('#b6').value), n = a * d, m = b * c;
      $('#fl6').innerHTML = `<span class="fcard">${a}/${b}</span><span>${flipped ? '×' : '÷'}</span><span class="fcard ${flipped ? 'flipped' : ''}">${flipped ? `${d}/${c}` : `${c}/${d}`}</span><span>=</span><span class="fcard" style="background:${flipped ? '#E3F6EC' : '#F6F9FF'}">${flipped ? full(n, m) : '?'}</span>`;
      // medir: cuántas piezas c/d caben en a/b
      const W = 420, total = a / b, piece = c / d, scale = W / Math.max(total, 1);
      let s = `<svg viewBox="-4 -4 ${W + 8} 110" width="${W}"><rect x="0" y="0" width="${total * scale}" height="40" fill="${C.tomato}" stroke="${C.ink}" stroke-width="2.5"/><text x="4" y="27" font-family="Lexend" font-size="15" font-weight="700" fill="#fff">${a}/${b}</text>`;
      let k = 0; for (let x = 0; x + 1e-9 < total; x += piece, k++) { const w = Math.min(piece, total - x) * scale, partial = total - x < piece - 1e-9;
        s += `<rect x="${x * scale}" y="52" width="${w}" height="40" fill="${k % 2 ? C.cheese : '#FFE08A'}" stroke="${C.ink}" stroke-width="2" ${partial ? 'stroke-dasharray="5 4"' : ''}/>`;
        if (w > 18) s += `<text x="${x * scale + w / 2}" y="78" text-anchor="middle" font-family="Lexend" font-size="14" font-weight="700" fill="${C.ink}">${k + 1}</text>`; }
      $('#v6').innerHTML = s + '</svg>';
      $('#e6').innerHTML = `Las piezas amarillas de ${c}/${d} caben <b>${mixedS(n, m)}</b> veces en ${a}/${b}.${flipped ? ` Con el truco: ${a}/${b} × ${d}/${c} = ${full(n, m)}.` : ' Toca el botón para ver el truco.'}`; };
    $('#go6').onclick = () => { flipped = !flipped; sfx.tap(); upd(); }; lab.querySelectorAll('select').forEach(e => e.onchange = () => { flipped = false; upd(); }); upd();
  },
  // 7 problemas
  lab => {
    lab.innerHTML = `<p class="note">Las palabras del problema te dicen qué operación usar. Toca cada tarjeta para descubrirlo.</p>
      <div class="keyword-grid">${[['"en total", "entre los dos", "juntos"', 'Suma ( + )'], ['"cuánto queda", "cuánto falta", "cuánto más"', 'Resta ( − )'], ['"3/4 de 20", "la mitad de"', 'Multiplicación ( × )'], ['"cuántas bolsas", "cuántos trozos", "repartir en"', 'División ( ÷ )']]
        .map(([k, a]) => `<button class="kw"><b>${k}</b><span class="ans">→ ${a}</span><span class="note" style="display:block;margin-top:6px">Toca para ver</span></button>`).join('')}</div>
      <h3 style="font-size:20px;margin-top:6px">Los 4 pasos de Pizzi</h3>
      <ol class="steps"><li><span><b>Leo</b> el problema dos veces y subrayo los datos.</span></li><li><span><b>Dibujo</b> una barra o una pizza si me ayuda.</span></li><li><span><b>Opero</b>: elijo la operación y la resuelvo.</span></li><li><span><b>Reviso</b>: ¿mi respuesta tiene sentido? ¿Le puse la unidad (km, litros, cm)?</span></li></ol>`;
    lab.querySelectorAll('.kw').forEach(b => b.onclick = () => { b.classList.add('open'); b.querySelector('.note').hidden = true; sfx.ok(); });
  },
  // 8 área y perímetro
  lab => {
    const COLS = 10, ROWS = 7, S = 34; let on = new Set(['2,2', '3,2', '4,2', '2,3', '3,3', '4,3']);
    lab.innerHTML = `<p class="note">Toca los cuadritos para pintar una figura. Cada cuadrito mide 1 cm de lado. El borde rojo es el <b>perímetro</b>; los cuadritos azules son el <b>área</b>.</p>
      <div class="controls"><div class="viz" id="v8"></div><div style="display:grid;gap:8px">
        <div class="chip" style="font-size:18px">Área: <b id="ar8"></b>&nbsp;cm²</div><div class="chip" style="font-size:18px;border-color:${C.tomato}">Perímetro: <b id="pe8"></b>&nbsp;cm</div>
        <button class="btn alt" id="clr8">Borrar</button><button class="btn alt" id="rect8">Rectángulo 4 × 3</button></div></div>
      <p class="note" id="e8"></p>`;
    const draw = () => { let s = `<svg viewBox="-3 -3 ${COLS * S + 6} ${ROWS * S + 6}" width="${COLS * S}" style="touch-action:manipulation">`;
      for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++) s += `<rect data-c="${x},${y}" x="${x * S}" y="${y * S}" width="${S}" height="${S}" fill="${on.has(x + ',' + y) ? '#7FB3E0' : C.card}" stroke="${C.line}" stroke-width="1" style="cursor:pointer"/>`;
      const cells = [...on].map(c => c.split(',').map(Number));
      cells.forEach(([x, y]) => [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => { if (!on.has(`${x + dx},${y + dy}`)) { const x1 = dx === 1 ? x + 1 : x, y1 = dy === 1 ? y + 1 : y, x2 = dx ? x1 : x + 1, y2 = dy ? y1 : y + 1; s += `<line x1="${x1 * S}" y1="${y1 * S}" x2="${x2 * S}" y2="${y2 * S}" stroke="${C.tomato}" stroke-width="4" stroke-linecap="round" pointer-events="none"/>`; } }));
      $('#v8').innerHTML = s + '</svg>';
      $('#ar8').textContent = cells.length; $('#pe8').textContent = perimCells(cells);
      const xs = cells.map(c => c[0]), ys = cells.map(c => c[1]); const w = cells.length ? Math.max(...xs) - Math.min(...xs) + 1 : 0, h = cells.length ? Math.max(...ys) - Math.min(...ys) + 1 : 0;
      $('#e8').innerHTML = cells.length && w * h === cells.length ? `¡Es un rectángulo de ${w} × ${h}! Área = ${w} × ${h} = <b>${w * h} cm²</b>. Perímetro = ${w} + ${h} + ${w} + ${h} = <b>${2 * (w + h)} cm</b>.` : cells.length ? 'Cuenta los cuadritos para el área y los bordes rojos para el perímetro.' : 'Toca la cuadrícula para empezar.';
      $('#v8').querySelectorAll('rect').forEach(r => r.onclick = () => { const c = r.dataset.c; on.has(c) ? on.delete(c) : on.add(c); sfx.tap(); draw(); }); };
    $('#clr8').onclick = () => { on = new Set(); draw(); };
    $('#rect8').onclick = () => { on = new Set(); for (let x = 1; x < 5; x++) for (let y = 1; y < 4; y++) on.add(x + ',' + y); draw(); };
    draw();
  },
];

updateStarCount();
home();
</script>
